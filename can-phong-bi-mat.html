<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Căn phòng giấu tim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=VT323&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --bg:#efe6f7; --ink:#2a1b3d; --panel:#fffaf2; --muted:#6b5a80; --heart:#e8364f;
  --font:'Pixelify Sans','VT323',system-ui,sans-serif;
  /* --ar: tỉ lệ khung cảnh, --ar-w: cùng tỉ lệ đó viết dưới dạng số (rộng/cao)
     --chrome: chiều cao mọi thứ nằm ngoài khung cảnh (tiêu đề, phụ đề, HUD, lề) */
  --ar:4/3; --ar-w:1.334;
  --chrome:calc(206px + env(safe-area-inset-top,0px) + env(safe-area-inset-bottom,0px));
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --bg:#1a1328; --ink:#f3e9ff; --panel:#2a1f3d; --muted:#b8a6d4; }
}
:root[data-theme="dark"]{ --bg:#1a1328; --ink:#f3e9ff; --panel:#2a1f3d; --muted:#b8a6d4; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:border-box; }
body{
  margin:0; min-height:100vh; min-height:100dvh; background:var(--bg); color:var(--ink);
  font-family:var(--font); display:flex; justify-content:center;
  -webkit-user-select:none; user-select:none;
  -webkit-tap-highlight-color:transparent; overscroll-behavior-y:contain;
}
.wrap{ width:100%; max-width:780px; padding:16px 12px 28px; }
h1{ font-size:clamp(22px,5vw,34px); margin:4px 0 2px; font-weight:700; letter-spacing:.5px; }
.sub{ margin:0 0 12px; color:var(--muted); font-size:clamp(14px,3.4vw,17px); }

/* pixel frame helper */
.px{
  box-shadow: 0 -4px 0 0 #2a1b3d, 0 4px 0 0 #2a1b3d, -4px 0 0 0 #2a1b3d, 4px 0 0 0 #2a1b3d;
}

/* ============ HUD ============ */
.hud{ display:flex; align-items:center; gap:10px; margin:0 4px 14px; flex-wrap:wrap; }
.count{
  background:#fffaf2; color:#2a1b3d; padding:6px 12px; font-size:18px; font-weight:600;
  display:flex; align-items:center; gap:8px;
}
.count svg{ width:20px; height:auto; display:block; }
.spacer{ flex:1; }
.btn{
  font-family:var(--font); font-size:16px; font-weight:600; cursor:pointer;
  background:#ffd35c; color:#2a1b3d; border:0; padding:6px 12px; margin:4px;
}
.btn:active{ transform:translateY(2px); }
.btn:focus-visible{ outline:3px dashed var(--heart); outline-offset:6px; }
.btn.ghost{ background:#fffaf2; }

/* ============ SCENE ============ */
.scene{
  position:relative; overflow:hidden;
  container-type:inline-size; margin:4px auto;
  aspect-ratio:var(--ar);
  /* lấy bề rộng nhỏ hơn giữa "vừa khung" và "vừa chiều cao màn hình" -> không phải cuộn để chơi */
  width:min(100% - 8px, (100vh - var(--chrome)) * var(--ar-w));
  width:min(100% - 8px, (100dvh - var(--chrome)) * var(--ar-w));
  touch-action:manipulation;
}

.wall{ position:absolute; inset:0 0 38% 0;
  background:repeating-linear-gradient(90deg,#8e7bb8 0 6cqw,#8572ad 6cqw 12cqw); }
.wall::after{ /* lamp glow */
  content:""; position:absolute; left:40%; top:0; width:60%; height:100%;
  background:radial-gradient(ellipse at 60% 20%, rgba(255,214,120,.28), transparent 60%);
}
.floor{ position:absolute; inset:62% 0 0 0;
  background:repeating-linear-gradient(0deg,#b8794a 0 3.2cqw,#a3683c 3.2cqw 3.6cqw);
  border-top:1.2cqw solid #5a3522; }

.window{ position:absolute; left:30%; top:7%; width:22%; height:30%;
  background:#262457; border:1cqw solid #f3e3c7; outline:.6cqw solid #2a1b3d; }
.window::before{ content:""; position:absolute; left:50%; top:0; bottom:0; width:.8cqw; background:#f3e3c7; transform:translateX(-50%); }
.window::after{ content:""; position:absolute; top:50%; left:0; right:0; height:.8cqw; background:#f3e3c7; transform:translateY(-50%); }
.moon{ position:absolute; left:14%; top:12%; width:4cqw; height:4cqw; background:#fff2b3;
  box-shadow: 1cqw 0 0 -.2cqw #262457 inset; }
.star{ position:absolute; width:.7cqw; height:.7cqw; background:#fff; }

.lamp{ position:absolute; left:60%; top:0; width:9%; height:16%; }
.lamp i{ position:absolute; left:48%; top:0; width:.5cqw; height:55%; background:#2a1b3d; }
.lamp b{ position:absolute; left:15%; bottom:0; width:70%; height:45%; background:#ffd35c; border:.6cqw solid #2a1b3d; border-bottom-width:0; }

.shelf{ position:absolute; left:58%; bottom:65.5%; width:37%; height:3cqw; background:#6e4128; border-bottom:.8cqw solid #2a1b3d; }

.bed-head{ position:absolute; left:2%; bottom:18%; width:4%; height:32%; background:#6e4128; border:.6cqw solid #2a1b3d; }
.bed{ position:absolute; left:3%; bottom:18%; width:36%; height:17%; background:#e8e0f5; border:.6cqw solid #2a1b3d; }
.bed::after{ content:""; position:absolute; left:32%; right:0; top:0; bottom:0; background:repeating-linear-gradient(45deg,#6ec6b8 0 2cqw,#5db3a5 2cqw 4cqw); border-left:.6cqw solid #2a1b3d; }
.bed-leg{ position:absolute; bottom:12%; width:2%; height:6%; background:#6e4128; border:.5cqw solid #2a1b3d; }

.table-top{ position:absolute; left:52%; bottom:33%; width:23%; height:3cqw; background:#8a5634; border:.6cqw solid #2a1b3d; }
.table-leg{ position:absolute; bottom:12%; width:2.2%; height:21%; background:#6e4128; border:.5cqw solid #2a1b3d; }

/* spots: object + what's hidden under it */
.spot{ position:absolute; }
.obj{
  position:relative; z-index:2; display:block; width:100%; padding:0; border:0; background:none;
  cursor:pointer; transition:transform .45s cubic-bezier(.2,1.6,.4,1);
}
.obj svg, .under svg, .heart svg{ display:block; width:100%; height:auto; image-rendering:pixelated; }
.obj:hover{ animation:wob .5s steps(3) 1; }
.obj:focus-visible{ outline:3px dashed #ffd35c; outline-offset:4px; }
.spot.lifted .obj{ pointer-events:none; animation:none; }
.spot.hint .obj{ animation:wob .5s steps(3) 3; }
@keyframes wob{ 0%,100%{transform:rotate(0)} 33%{transform:rotate(-6deg)} 66%{transform:rotate(6deg)} }

.under{ position:absolute; left:50%; bottom:0; transform:translateX(-50%); z-index:1; }
.spot.lifted .under{ z-index:3; }

.heart{ width:7cqw; cursor:grab; touch-action:none; }
.spot.lifted .heart{ animation:bob 1s steps(2) infinite; }
.heart.dragging{ cursor:grabbing; animation:none !important; filter:drop-shadow(0 6px 0 rgba(42,27,61,.35)); }
@keyframes bob{ 50%{ transform:translateY(-12%);} }

.bubble{
  position:absolute; left:50%; bottom:105%; transform:translateX(-50%);
  background:#fffaf2; color:#2a1b3d; font-size:clamp(11px,2.3cqw,16px); line-height:1.2;
  padding:5px 8px; white-space:nowrap; z-index:6; pointer-events:none;
  animation:pop .25s steps(3);
}
@keyframes pop{ from{ transform:translate(-50%,20%) scale(.6); opacity:0;} }

.collector{ position:absolute; left:77%; bottom:3%; width:18%; z-index:4; }
.collector.hover{ transform:scale(1.1); }
.collector.bump{ animation:bump .35s steps(3); }
@keyframes bump{ 50%{ transform:scale(1.18) rotate(-4deg);} }
.collector .label{
  position:absolute; left:50%; bottom:108%; transform:translateX(-50%);
  font-size:clamp(11px,2.3cqw,15px); color:#fffaf2; white-space:nowrap; text-shadow:2px 2px 0 #2a1b3d;
}

.toast{
  position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%);
  background:#2a1b3d; color:#fffaf2; padding:8px 14px; font-size:16px; z-index:50; opacity:0; transition:opacity .2s;
  pointer-events:none;
}
.toast.show{ opacity:1; }

/* ============ OVERLAYS ============ */
.overlay{
  position:fixed; inset:0; background:rgba(26,19,40,.72); z-index:100;
  display:none; align-items:center; justify-content:center; padding:20px;
  overflow-y:auto; overscroll-behavior:contain;
}
.overlay.show{ display:flex; }
.card{
  position:relative; background:#fffaf2; color:#2a1b3d; width:100%; max-width:440px;
  padding:24px 22px; text-align:center; animation:pop2 .35s steps(4);
}
@keyframes pop2{ from{ transform:scale(.5); opacity:0; } }
.card h2{ margin:0 0 10px; font-size:24px; }
.card p{ font-size:18px; line-height:1.45; margin:0 0 16px; }
.photo{ width:min(320px,72vw,46dvh); margin:6px auto 20px; background:#2a1b3d; }
.photo canvas{
  display:block; width:100%; height:auto;
  image-rendering:-webkit-optimize-contrast; image-rendering:crisp-edges; image-rendering:pixelated;
}
.gift-wiggle{ animation:wob .6s steps(3) infinite; }
.card .big-heart{ width:64px; margin:0 auto 10px; }
.letter{
  text-align:left; min-height:140px; font-size:19px; line-height:1.5; margin-bottom:16px;
  background:repeating-linear-gradient(0deg,transparent 0 27px,#f0d9e0 27px 28.5px);
  white-space:pre-wrap;
}
.letter .cursor{ display:inline-block; width:9px; height:18px; background:#e8364f; vertical-align:-3px; animation:blink .8s steps(1) infinite; }
@keyframes blink{ 50%{ opacity:0; } }
.ask{ display:none; }
.ask.show{ display:block; }
.ask h3{ font-size:21px; margin:0 0 16px; }
.choices{ position:relative; height:70px; }
.choices .btn{ position:absolute; top:10px; font-size:18px; padding:8px 18px; transition:left .15s, top .15s; }
#yesBtn{ left:18%; background:#e8364f; color:#fffaf2; }
#noBtn{ left:58%; background:#fffaf2; }

.rain{ position:fixed; top:-60px; width:36px; z-index:120; pointer-events:none; animation:fall linear forwards; }
@keyframes fall{ to{ transform:translateY(calc(100dvh + 120px)) rotate(20deg); } }

/* ===== iPhone 14 Plus dọc (428 x 926) và các điện thoại tương tự ===== */
@media (max-width:560px){
  :root{
    --ar:1/1; --ar-w:1;
    --chrome:calc(182px + env(safe-area-inset-top,0px) + env(safe-area-inset-bottom,0px));
  }
  body{ align-items:center; }        /* màn hình dài: dồn nội dung vào giữa cho cân */
  .wrap{ padding:10px 10px 20px; }
  .hud{ margin-bottom:10px; }
  .btn{ padding:9px 14px; }          /* vùng bấm đủ rộng cho ngón tay */
  .count{ padding:8px 12px; }
  .heart{ width:9cqw; }              /* trái tim to hơn để kéo cho dễ */
  .collector{ width:22%; }
}

/* ===== iPhone 14 Plus nằm ngang (926 x 428): màn hình rất thấp ===== */
@media (max-height:560px) and (orientation:landscape){
  :root{
    --ar:16/10; --ar-w:1.6;
    --chrome:calc(112px + env(safe-area-inset-top,0px) + env(safe-area-inset-bottom,0px));
  }
  .wrap{ padding:6px 12px 12px; }
  h1{ font-size:20px; margin:0; }
  .sub{ display:none; }
  .hud{ margin-bottom:8px; }
  .card{ padding:16px 18px; }
  .card h2{ font-size:20px; }
}

/* ===== màn hình máy tính 13-15 inch: dùng rộng hơn cho đã mắt ===== */
@media (min-width:900px){
  .wrap{ max-width:940px; }
}

@media (prefers-reduced-motion:reduce){
  *{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
}
</style>
</head>
<body>
<div class="wrap">
  <h1>Căn phòng giấu tim</h1>
  <p class="sub">Lật đồ vật lên, tìm trái tim rồi kéo vào hộp quà.</p>

  <div class="hud">
    <div class="count px" id="count"></div>
    <div class="spacer"></div>
    <button class="btn px" id="hintBtn">Gợi ý</button>
    <button class="btn ghost px" id="soundBtn">Tiếng: bật</button>
  </div>

  <div class="scene px" id="scene">
    <div class="wall"></div>
    <div class="floor"></div>
    <div class="window"><div class="moon"></div>
      <div class="star" style="left:62%;top:20%"></div><div class="star" style="left:78%;top:62%"></div><div class="star" style="left:30%;top:70%"></div>
    </div>
    <div class="lamp"><i></i><b></b></div>
    <div class="shelf"></div>
    <div class="bed-head"></div>
    <div class="bed"></div>
    <div class="bed-leg" style="left:5%"></div><div class="bed-leg" style="left:36%"></div>
    <div class="table-top"></div>
    <div class="table-leg" style="left:54%"></div><div class="table-leg" style="left:71%"></div>

    <div class="collector" id="collector"><div class="label" id="boxLabel">Thả tim vào đây</div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- intro -->
<div class="overlay show" id="intro">
  <div class="card px">
    <div class="big-heart" id="introHeart"></div>
    <h2>Có tim đi lạc</h2>
    <p id="introText"></p>
    <button class="btn px" id="startBtn" style="font-size:19px;padding:8px 20px">Bắt đầu tìm</button>
  </div>
</div>

<!-- open gift -->
<div class="overlay" id="letterBox">
  <div class="card px">
    <div class="big-heart gift-wiggle" id="giftIcon"></div>
    <h2 id="question" style="margin-bottom:18px"></h2>
    <button class="btn px" id="yesBtn" style="font-size:19px;padding:8px 22px;background:#e8364f;color:#fffaf2">Mở quà</button>
  </div>
</div>

<!-- final -->
<div class="overlay" id="finalBox">
  <div class="card px">
    <div class="photo px"><canvas id="photo" width="320" height="320" aria-label="Ảnh pixel"></canvas></div>
    <h2 id="finalText"></h2>
  </div>
</div>

  ],
  slippers:[
    ".kkkkk...kkkkk.",
    "kPPPPPk.kPPPPPk",
    "kpwppPk.kpwppPk",
    "kpppppk.kpppppk",
    "kpppppk.kpppppk",

  ],
  carton:[
    "kkkkkkkkkkkkkk",

function sprite(rows){
  const h = rows.length, w = Math.max(...rows.map(r => r.length));
  let s = "";
  rows.forEach((row, y) => [...row].forEach((c, x) => {
    if (PAL[c]) s += `<rect x="${x}" y="${y}" width="1" height="1" fill="${PAL[c]}"/>`;
  }));
  return `<svg viewBox="0 0 ${w} ${h}" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${s}</svg>`;
}

/* ============ SCENE OBJECTS ============ */
// x, y = left / bottom (% of scene); w = width (%); lift = how it moves when flipped
const SPOTS = [
  { id:"pillow",   name:"cái gối",      x:8,  y:34.5, w:14, heart:true,  lift:"translate(55%,-150%) rotate(18deg)", say:"Tìm thấy rồi nè!" },
  { id:"books",    name:"chồng sách",   x:61, y:67.5, w:11, heart:true,  lift:"translate(-20%,-160%) rotate(-10deg)", say:"Kẹp giữa trang sách!" },
  { id:"mug",      name:"cốc cà phê",   x:83, y:67.5, w:6,  heart:false, lift:"translate(110%,-90%) rotate(25deg)", say:"Chỉ có vệt cà phê thôi~" },
  { id:"hat",      name:"cái mũ",       x:54, y:36.5, w:11, heart:false, lift:"translate(0,-170%) rotate(-12deg)", say:"Không có gì, hihi" },
  { id:"plant",    name:"chậu cây",     x:85, y:30,   w:9,  heart:true,  lift:"translate(-80%,-35%) rotate(-14deg)", say:"Trốn sau chậu cây!" },
  { id:"cat",      name:"con mèo",      x:39, y:6,    w:15, heart:true,  lift:"translate(95%,-25%)", say:"Meo~ tớ ấp hộ nãy giờ" },
  { id:"slippers", name:"đôi dép",      x:23, y:4,    w:11, heart:false, lift:"translate(10%,-150%) rotate(10deg)", say:"Chỉ có tất bị lạc thôi" },
  { id:"carton",   name:"thùng giấy",   x:3,  y:3,    w:13, heart:true,  lift:"translate(-5%,-120%) rotate(-10deg)", say:"Trong thùng giấy nè!" },
];
const TOTAL = SPOTS.filter(s => s.heart).length;
let collected = 0, soundOn = true;

const scene = document.getElementById("scene");
const collector = document.getElementById("collector");
collector.insertAdjacentHTML("afterbegin", sprite(S.gift));

SPOTS.forEach(sp => {
  const el = document.createElement("div");
  el.className = "spot";
  el.style.left = sp.x + "%";
  el.style.bottom = sp.y + "%";
  el.style.width = sp.w + "%";
  el.style.zIndex = Math.round(100 - sp.y);
  el.innerHTML = `
    <div class="under">${sp.heart ? `<div class="heart" aria-label="Trái tim">${sprite(S.heart)}</div>` : ""}</div>
    <button class="obj" aria-label="Lật ${sp.name}">${sprite(S[sp.id])}</button>`;
  sp.el = el;
  el.querySelector(".obj").addEventListener("click", () => lift(sp));
  const h = el.querySelector(".heart");
  if (h) setupDrag(h, sp);
  scene.appendChild(el);
});

function lift(sp){
  if (sp.el.classList.contains("lifted")) return;
  sp.el.classList.remove("hint");
  sp.el.classList.add("lifted");
  sp.el.querySelector(".obj").style.transform = sp.lift;
  sp.el.style.zIndex = 200;
  sfx(sp.heart ? "found" : "nope");
  bubble(sp.el, sp.say);
}

function bubble(el, text){
  const b = document.createElement("div");
  b.className = "bubble px";
  b.textContent = text;
  el.appendChild(b);
  setTimeout(() => b.remove(), 2000);
}

/* ============ DRAG & DROP ============ */
let drag = null;
function setupDrag(heart, sp){
  heart.addEventListener("pointerdown", e => {
    if (!sp.el.classList.contains("lifted")) return;
    e.preventDefault();
    const r = heart.getBoundingClientRect();
    drag = { heart, sp, parent: heart.parentNode, dx: e.clientX - r.left, dy: e.clientY - r.top,
             sx: e.clientX, sy: e.clientY, moved: false };
    document.body.appendChild(heart);
    Object.assign(heart.style, { position:"fixed", left:r.left+"px", top:r.top+"px", width:r.width+"px", zIndex:1000 });
    heart.classList.add("dragging");
    sfx("pick");
  });
}
window.addEventListener("pointermove", e => {
  if (!drag) return;
  if (Math.abs(e.clientX - drag.sx) + Math.abs(e.clientY - drag.sy) > 6) drag.moved = true;
  drag.heart.style.left = (e.clientX - drag.dx) + "px";
  drag.heart.style.top  = (e.clientY - drag.dy) + "px";
  collector.classList.toggle("hover", overBox(e));
});
window.addEventListener("pointerup", e => {
  if (!drag) return;
  const d = drag; drag = null;
  collector.classList.remove("hover");
  if (overBox(e)) collect(d);
  else {
    d.heart.classList.remove("dragging");
    d.heart.removeAttribute("style");
    d.parent.appendChild(d.heart);
    if (!d.moved) toast("Giữ và kéo trái tim vào hộp quà nhé");
  }
});
window.addEventListener("pointercancel", () => {
  if (!drag) return;
  drag.heart.classList.remove("dragging"); drag.heart.removeAttribute("style");
  drag.parent.appendChild(drag.heart); drag = null;
});
function overBox(e){
  const r = collector.getBoundingClientRect();
  const pad = matchMedia("(pointer:coarse)").matches ? 30 : 18;   // chạm bằng ngón tay thì nới vùng thả
  return e.clientX > r.left - pad && e.clientX < r.right + pad && e.clientY > r.top - pad*2 && e.clientY < r.bottom + pad;
}
function collect(d){
  const r = collector.getBoundingClientRect();
  const h = d.heart;
  h.style.transition = "left .3s, top .3s, width .3s, opacity .3s";
  h.style.left = (r.left + r.width/2 - 8) + "px";
  h.style.top = (r.top + r.height*0.2) + "px";
  h.style.width = "16px";
  h.style.opacity = "0";
  setTimeout(() => h.remove(), 320);
  collected++;
  updateCount();
  collector.classList.remove("bump"); void collector.offsetWidth; collector.classList.add("bump");
  sfx("drop");
  if (collected === TOTAL) setTimeout(openLetter, 800);
}

function updateCount(){
  document.getElementById("count").innerHTML = sprite(S.heart) + `<span>${collected} / ${TOTAL}</span>`;
  document.getElementById("boxLabel").textContent =
    collected === 0 ? "Thả tim vào đây" : collected < TOTAL ? `Còn ${TOTAL - collected} tim` : "Đủ rồi!";
}

/* ============ HINT / TOAST ============ */
document.getElementById("hintBtn").addEventListener("click", () => {
  const waiting = document.querySelector(".spot.lifted .heart:not(.dragging)");
  if (waiting && waiting.closest(".spot")){ toast("Có tim đang chờ, kéo nó vào hộp đi"); return; }
  const sp = SPOTS.find(s => s.heart && !s.el.classList.contains("lifted"));
  if (!sp){ toast("Hết chỗ giấu rồi"); return; }
  sp.el.classList.remove("hint"); void sp.el.offsetWidth; sp.el.classList.add("hint");
  toast(`Thử lật ${sp.name} xem`);
  sfx("pick");
});
let toastT;
function toast(t){
  const el = document.getElementById("toast");
  el.textContent = t; el.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("show"), 1800);
}

/* ============ 8-BIT SOUND ============ */
let ac;
function tone(f, t0, dur, type="square", vol=.06){
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, ac.currentTime + t0);
  g.gain.setValueAtTime(vol, ac.currentTime + t0);
  g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + t0 + dur);
  o.connect(g).connect(ac.destination);
  o.start(ac.currentTime + t0); o.stop(ac.currentTime + t0 + dur + .02);
}
function sfx(kind){
  if (!soundOn) return;
  try{
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === "suspended") ac.resume();
    const seq = {
      found:[[660,0,.08],[880,.08,.08],[1320,.16,.14]],
      nope:[[300,0,.1],[220,.1,.14]],
      pick:[[990,0,.05]],
      drop:[[523,0,.07],[784,.07,.07],[1046,.14,.12]],
      win:[[523,0,.1],[659,.1,.1],[784,.2,.1],[1046,.3,.25],[784,.55,.1],[1046,.65,.35]],
      type:[[1400,0,.02,"square",.02]],
    }[kind] || [];
    seq.forEach(s => tone(...s));
  }catch(e){}
}
document.getElementById("soundBtn").addEventListener("click", e => {
  soundOn = !soundOn; e.target.textContent = "Tiếng: " + (soundOn ? "bật" : "tắt");
});

/* ============ PIXEL PHOTO REVEAL ============ */
const photoImg = new Image();
photoImg.src = CONFIG.photo;

const photoCv = document.getElementById("photo");
const photoCtx = photoCv.getContext("2d");
const photoTmp = document.createElement("canvas");
const photoTctx = photoTmp.getContext("2d");
let photoRes = 0;                       // độ phân giải của khung đang hiện; 0 = chưa vẽ ảnh lần nào

// Cho canvas đúng bằng số pixel vật lý mà màn hình dành cho nó, để trình duyệt không co giãn lại lần nữa.
// Trả về true nếu kích thước thay đổi (đổi kích thước canvas sẽ xoá sạch nội dung -> phải vẽ lại).
function fitPhotoCanvas(){
  const cssW = photoCv.getBoundingClientRect().width || 280;
  const dpr  = Math.min(window.devicePixelRatio || 1, 3);
  const size = Math.max(64, Math.min(1600, Math.round(cssW * dpr)));
  if (photoCv.width === size) return false;
  photoCv.width = photoCv.height = size;
  return true;
}

// Vẽ một khung của hiệu ứng: res = số ô vuông mỗi cạnh.
// res >= kích thước ảnh gốc nghĩa là khung cuối -> vẽ thẳng ảnh gốc cho nét nhất.
function drawPhoto(res){
  const src = photoImg.naturalWidth || 80, size = photoCv.width;
  photoRes = res;
  if (res >= src){
    photoCtx.imageSmoothingEnabled = true; photoCtx.imageSmoothingQuality = "high";
    photoCtx.drawImage(photoImg, 0, 0, size, size);
  } else {
    photoTmp.width = photoTmp.height = res;
    photoTctx.imageSmoothingEnabled = true; photoTctx.imageSmoothingQuality = "high";
    photoTctx.clearRect(0, 0, res, res);
    photoTctx.drawImage(photoImg, 0, 0, res, res);
    photoCtx.imageSmoothingEnabled = false;          // giữ ô vuông sắc cạnh cho các khung mosaic
    photoCtx.drawImage(photoTmp, 0, 0, res, res, 0, 0, size, size);
  }
}

function revealPhoto(){
  const run = () => {
    fitPhotoCanvas();
    const src = photoImg.naturalWidth || 80;
    const steps = matchMedia("(prefers-reduced-motion: reduce)").matches
      ? [src] : [6, 12, 22, 40, 72, 140, src];
    let i = 0;
    const next = () => {
      drawPhoto(steps[i]);
      sfx("pick");
      if (++i < steps.length) setTimeout(next, 260);
    };
    next();
  };
  photoImg.complete ? run() : (photoImg.onload = run);
}

// Xoay máy / đổi cỡ cửa sổ: khung ảnh rộng lên hay hẹp đi thì canvas phải đổi theo,
// nếu không ảnh cũ bị kéo giãn và nhoè. Vẽ lại đúng khung đang hiện (photoRes),
// nên nếu hiệu ứng đang chạy dở thì nó vẫn chạy tiếp bình thường, không nhảy cóc tới ảnh rõ.
let photoResizeT;
window.addEventListener("resize", () => {
  if (!photoRes) return;
  clearTimeout(photoResizeT);
  photoResizeT = setTimeout(() => { if (fitPhotoCanvas()) drawPhoto(photoRes); }, 150);
});

/* ============ INTRO / LETTER / FINAL ============ */
document.getElementById("introHeart").innerHTML = sprite(S.heart);
document.getElementById("giftIcon").innerHTML = sprite(S.gift);
document.getElementById("introText").textContent =
  `${TOTAL} trái tim đang trốn trong căn phòng này. Bấm vào đồ vật để lật lên, thấy tim thì kéo vào hộp quà nhé.`;
document.getElementById("startBtn").addEventListener("click", () => {
  document.getElementById("intro").classList.remove("show");
  sfx("found");
});
updateCount();

function openLetter(){
  sfx("win");
  document.getElementById("question").textContent = CONFIG.question;
  document.getElementById("letterBox").classList.add("show");
}

document.getElementById("yesBtn").addEventListener("click", () => {
  document.getElementById("letterBox").classList.remove("show");
  document.getElementById("finalText").textContent = CONFIG.yes;
  document.getElementById("finalBox").classList.add("show");
  revealPhoto();
  sfx("win");
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  for (let n = 0; n < 40; n++){
    setTimeout(() => {
      const h = document.createElement("div");
      h.className = "rain";
      h.innerHTML = sprite(S.heart);
      h.style.left = Math.random() * 100 + "vw";
      h.style.width = (20 + Math.random() * 30) + "px";
      h.style.animationDuration = (2.5 + Math.random() * 2.5) + "s";
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 5200);
    }, n * 90);
  }
});
</script>
